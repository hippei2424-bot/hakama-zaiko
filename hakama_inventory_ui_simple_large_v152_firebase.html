<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>れじぇんど袴在庫管理</title>
<style>
  :root{
    --bg:#f7f3ee; --card:#fffaf4; --ink:#2b241f; --muted:#83746a;
    --line:#eadfd3; --main:#8b5e3c; --main2:#b9895e;
    --danger:#b94a48; --ok:#3f7d58; --shadow:0 10px 25px rgba(54,36,20,.08);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(180deg,#fbf7f1,#f1e8dd);
    color:var(--ink);
    padding-bottom:88px;
  }
  header{
    position: relative; top:auto; 
    background:rgba(247,243,238,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:14px 14px 10px;
  }
  h1{margin:0;font-size:20px;letter-spacing:.04em}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
  .tab{
    border:1px solid var(--line); background:#fff; color:var(--muted);
    border-radius:999px; padding:10px 4px; font-weight:700; font-size:12px;
  }
  .tab.active{background:var(--main);color:white;border-color:var(--main)}
  main{padding:14px;max-width:760px;margin:auto}
  section{display:none}
  section.active{display:block}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px; margin-bottom:14px;
  }
  .title{font-size:16px;font-weight:800;margin:0 0 10px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:700}
  input,select,textarea{
    width:100%; border:1px solid var(--line); border-radius:14px;
    background:white; padding:13px; font-size:16px; color:var(--ink); outline:none;
  }
  textarea{min-height:88px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--main2);box-shadow:0 0 0 3px rgba(185,137,94,.18)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{border:0;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:800;cursor:pointer}
  .btn-main{background:var(--main);color:white}
  .btn-sub{background:#efe4d8;color:var(--ink)}
  .btn-danger{background:#f3dfdd;color:var(--danger)}
  .btn-ok{background:#e0efe5;color:var(--ok)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 9px; border-radius:999px; font-size:11px;
    font-weight:800; margin:3px 3px 0 0;
    border:1px solid rgba(0,0,0,.06); background:#f2e8dc; color:#6a4a31;
  }
  .item{
    background:#fff; border:1px solid var(--line);
    border-radius:16px; padding:12px; margin:10px 0;
  }
  .item h3{margin:0 0 3px;font-size:16px}
  .meta{font-size:12px;color:var(--muted);line-height:1.65}
  .miniActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
  .miniActions button{font-size:12px;padding:10px 6px}
  .notice{
    border-radius:14px; padding:11px; font-size:13px; line-height:1.5;
    background:#fff7df; color:#7b5517; border:1px solid #f0dba1; margin-top:10px;
  }
  .bad{background:#fde7e4;border-color:#f1b8b2;color:#8a302b}
  .good{background:#e8f5eb;border-color:#b8dfc2;color:#27643e}
  .checkGroup{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .checkItem{
    display:flex;
    align-items:center;
    gap:8px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:4px;
    font-size:13px;
    font-weight:800;
    color:var(--ink);
  }
  .checkItem input{
    width:20px;
    height:20px;
    padding:0;
    accent-color:var(--main);
  }
  .countBox{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .count{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
  .count b{display:block;font-size:20px}
  .count span{font-size:11px;color:var(--muted);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:13px}
  .editMode{border-color:#d5a061!important;box-shadow:0 0 0 3px rgba(213,160,97,.18)!important}
  .bottomBar{
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(255,250,244,.94); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    
  }
  .bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){
    .grid2{grid-template-columns:1fr}
  }

<body>
<header>
  <h1>れじぇんど袴在庫管理</h1>
</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('home')">検索</button>
    <button class="tab" onclick="showTab('reserve')">予約</button>
    <button class="tab" onclick="showTab('add')">登録</button>
    <button class="tab" onclick="showTab('settings')">設定</button>
  </div>
</header>

<main>
  <section id="home" class="active">
    <div class="searchMenu">
      <button type="button" class="searchMenuBtn active" onclick="showSearchPanel('available')">使用可能在庫検索</button>
      <button type="button" class="searchMenuBtn" onclick="showSearchPanel('sizeAvailable')">サイズ別在庫数検索</button>
      <button type="button" class="searchMenuBtn" onclick="showSearchPanel('inventory')">袴在庫検索</button>
      <button type="button" class="searchMenuBtn" onclick="showSearchPanel('usageList')">使用日一覧検索</button>
      <button type="button" class="searchMenuBtn" onclick="showSearchPanel('customer')">お客様名検索</button>
    </div>

    <div id="searchPanel_available" class="searchPanel activeSearchPanel">

    <div class="card availableSearchCard">
      <p class="title">使用可能在庫検索</p>

      <label>種類</label>
      <select id="availableType" onchange="selectedAvailableSize=''; updateAvailableColorFilter(); setDefaultAvailableUseDateToMarch();
renderAvailableStock();">
        <option value="">すべて</option>
        <option>無地</option><option>刺繍</option><option>ボカシ</option><option>HL</option><option>レース</option><option>その他</option>
      </select>

      <label>色</label>
      <select id="availableColor" onchange="selectedAvailableSize=''; renderAvailableStock()">
        <option value="">すべて</option>
      </select>

      <label>使用日</label>
      <input id="availableUseDate" type="date" value="2027-03-01" onchange="selectedAvailableSize=''; renderAvailableStock()" onfocus="prepareMarchCalendar(this)" />



      <div class="availableResultTitle">使用可能数</div>
      <div class="sizeStockGrid" id="availableSizeCounts"></div>
      <div id="selectedAvailableSizeNote" class="helperText" style="display:none;margin-top:14px;"></div>
      <div id="availableItemList" style="margin-top:12px;"></div>
    </div>

    </div>

    
    <div id="searchPanel_sizeAvailable" class="searchPanel">
      <div class="card availableSearchCard">
        <p class="title">サイズ別在庫数検索</p>

        <label>サイズ</label>
        <select id="sizeAvailableSize" onchange="selectedSizeAvailableGroup=''; renderSizeAvailableSearch()">
          <option>SS</option>
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>LL</option>
          <option>3L</option>
        </select>

        <label>使用日</label>
        <input id="sizeAvailableUseDate" type="date" value="2027-03-01" onchange="selectedSizeAvailableGroup=''; renderSizeAvailableSearch()" onfocus="prepareMarchCalendar(this)" />

        <div class="availableResultTitle">使用可能な袴</div>
        <div id="sizeAvailableResults" class="typeStockGrid"></div>

      </div>
    </div>

<div id="searchPanel_inventory" class="searchPanel">


    <div class="card">
      <p class="title">在庫検索</p>

      <label>種類</label>
      <select id="filterType" onchange="selectedInventorySize=''; updateInventoryColorFilter(); renderItems();">
        <option value="">すべて</option>
        <option>無地</option><option>刺繍</option><option>ボカシ</option><option>HL</option><option>レース</option><option>その他</option>
      </select>

      <label>色</label>
      <select id="filterColor" onchange="selectedInventorySize=''; renderItems()">
        <option value="">すべて</option>
      </select>
<div id="sizeStockCard" style="display:none;margin-top:20px;">
        <div class="availableResultTitle">サイズ別在庫数</div>
        <div class="sizeStockGrid" id="sizeStockCounts"></div>
      </div>
    </div>


    

    

    <div id="itemList"></div>
  
    </div>

    <div id="searchPanel_usageList" class="searchPanel">
      <div class="card usageListCard">
        <p class="title">使用日一覧検索</p>

        <label>使用期間</label>
        <div class="periodRow">
          <input id="usageListStartDate" type="date" value="2027-03-01" onchange="renderUsageListSearch()" />
          <span class="periodTilde">〜</span>
          <input id="usageListEndDate" type="date" value="2027-03-31" onchange="renderUsageListSearch()" />
        </div>

        <label>店舗</label>
        <select id="usageListStore" onchange="renderUsageListSearch()">
          <option value="">すべて</option>
          <option>本店</option>
          <option>伏見店</option>
          <option>洛西店</option>
        </select>
<button type="button" class="btn-sub printUsageBtn" onclick="downloadUsageListPrintFile()">印刷用ファイルをダウンロード</button>

        <div id="usageListResults" style="margin-top:18px;"></div>
      </div>
    </div>


  
    
    <div id="searchPanel_customer" class="searchPanel">
      <div class="card usageListCard">
        <p class="title">お客様名検索</p>

        <label>お客様名</label>
        <input id="customerSearchKeyword" placeholder="お客様名を入力" oninput="renderCustomerSearch()" />

        <div id="customerSearchResults" style="margin-top:18px;"></div>
      </div>
    </div>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function getTypeShort(type){
  const map = {
    '無地':'無',
    '刺繍':'刺',
    'ボカシ':'ボ',
    'HL':'H',
    'レース':'レ',
    'その他':'他'
  };
  return map[type] || String(type || '').slice(0,1);
}

function getColorShort(color){
  const map = {
    '黒':'黒',
    '紺':'紺',
    '緑':'緑',
    '紫':'紫',
    'えんじ':'え',
    '桜':'桜',
    '濃ピンク':'濃',
    'グレー':'グ',
    'ワイン':'ワ',
    '白':'白',
    'ブラウン':'ブ',
    'ベージュ':'ベ',
    'チャコール':'チ',
    'モス':'モ',
    '白(梅)':'梅',
    'A(紫)':'A',
    'C(ピンク)':'C',
    'D(赤)':'D'
  };
  return map[color] || String(color || '').slice(0,1);
}

function getCodePrefix(type, color, size=''){
  return `${getTypeShort(type)}${getColorShort(color)}${size || ''}`;
}

function generateCode(type = val('type'), color = val('color'), size = val('size')){
  const prefix = getCodePrefix(type, color, size);
  const nums = items
    .filter(x => String(x.code || '').startsWith(prefix + '-'))
    .map(x=>{
      const m = String(x.code || '').match(/-(\d+)$/);
      return m ? parseInt(m[1]) : 0;
    });
  const next = (Math.max(0, ...nums) + 1).toString().padStart(3,'0');
  return `${prefix}-${next}`;
}

function updateAutoCode(){
  if(editingId) return;
  const codeInput = document.getElementById('code');
  if(codeInput){
    codeInput.value = generateCode();
  }
}
function updateColorOptions(selectedColor=''){
  const type = document.getElementById('type').value;
  const colorSelect = document.getElementById('color');
  const colors = colorOptionsByType[type] || [];
  colorSelect.innerHTML = colors.map(c => `<option>${c}</option>`).join('');
  if(selectedColor && colors.includes(selectedColor)) colorSelect.value = selectedColor;
  if(typeof updateAutoCode === 'function') updateAutoCode();
}
function getChecks(){

  if(document.getElementById('noAlter').checked) labels.push('直し不可');

  if(document.getElementById('noDelivery').checked) labels.push('お渡し不可');
  if(document.getElementById('hasWear').checked) labels.push('スレあり');
  return labels;
}

  document.getElementById('noDelivery').checked = checks.includes('お渡し不可');

}
function renderReserveOptions(){
  if(typeof syncAllInventoryToMasterData === "function" && !window.__syncingInventory){ window.__syncingInventory = true; try{
  localStorage.removeItem('hakama_items');
}catch(e){}
syncAllInventoryToMasterData(); window.__syncingInventory = false; }
  const select = document.getElementById('reserveCode');
  const colorSelect = document.getElementById('reserveFilterColor');

  if(!select) return;

  const typeFilter = document.getElementById('reserveFilterType')?.value || '';
  const colorFilter = document.getElementById('reserveFilterColor')?.value || '';

  // 色候補生成
  let colors = [...new Set(
    items
      .filter(x => !typeFilter || x.type === typeFilter)
      .map(x => x.color)
  )];

  const currentColor = colorSelect.value;
  colorSelect.innerHTML = '<option value="">色すべて</option>' +
    colors.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

  if(colors.includes(currentColor)){
    colorSelect.value = currentColor;
  }

  let filtered = items.filter(x=>{
    return (!typeFilter || x.type===typeFilter)
      && (!colorFilter || x.color===colorFilter);
  });

  if(!filtered.length){
    select.innerHTML = '<option value="">該当する袴がありません</option>';
    return;
  }

  const current = select.value;

  select.innerHTML =
    '<option value="">選択してください</option>' +
    filtered.map(x=>{
      const checks = (x.checks||[]).length ? '／' + (x.checks||[]).join('・') : '';
      const label = `${x.type}｜${x.color}｜${x.size}｜${x.code}${checks}`;
      return `<option value="${escapeHtml(x.code)}">${escapeHtml(label)}</option>`;
    }).join('');

  if(current && filtered.some(x=>x.code===current)){
    select.value = current;
  }
}

function renderSizeAvailableSearch(){
  if(typeof syncAllInventoryToMasterData === "function" && !window.__syncingInventory){ window.__syncingInventory = true; syncAllInventoryToMasterData(); window.__syncingInventory = false; }
  const box = document.getElementById('sizeAvailableResults');
  if(!box) return;

  const size = document.getElementById('sizeAvailableSize')?.value || '';
  const useDate = document.getElementById('sizeAvailableUseDate')?.value || getDefaultMarchDate();

  const available = items.filter(x=>{
    return (!size || x.size === size) && isItemAvailableForUseDate(x, useDate);
  });

  const groups = {};
  available.forEach(x=>{
    const key = `${x.type}｜${x.color}`;
    if(!groups[key]){
      groups[key] = {
        key,
        type:x.type,
        color:x.color,
        count:0
      };
    }
    groups[key].count++;
  });

  const list = Object.values(groups).sort((a,b)=>{
    return `${a.type}${a.color}`.localeCompare(`${b.type}${b.color}`, 'ja');
  });

  if(!list.length){
    box.innerHTML = '<div class="empty">使用可能な袴がありません</div>';
    return;
  }

  box.innerHTML = list.map(g=>{
    const filtered = sortItemsByCode(
      available.filter(x => `${x.type}｜${x.color}` === g.key)
    );

    const selected = selectedSizeAvailableGroup === g.key;

    return `
      <div class="typeStockWrap">
        <button type="button"
          class="typeStockCard${selected ? ' selectedTypeStockCard' : ''}"
          onclick="selectSizeAvailableGroup('${escapeHtml(g.key)}')">

          <div class="typeStockMain">
            <b>${escapeHtml(g.count)}</b>
            <span>${escapeHtml(g.type)} ／ ${escapeHtml(g.color)}</span>
          </div>

          <div class="typeStockSub">
            ${escapeHtml(size)}サイズ｜タップで詳細
          </div>
        </button>

        ${selected ? `
          <div class="inlineSizeDetailList">
            ${filtered.map(x=>`
              <div class="item sizeDetailReserveItem" onclick="reserveFromSizeAvailableItem('${encodeURIComponent(x.code)}')">
                <h3>${escapeHtml(x.code)}</h3>

                  サイズ：${escapeHtml(x.size||'-')}<br>
                  元サイズ：${escapeHtml(x.originalSize||'-')}<br>

function renderUsageListSearch(){
  const box = document.getElementById('usageListResults');
  if(!box) return;

  const startDate = document.getElementById('usageListStartDate')?.value || '';
  const endDate = document.getElementById('usageListEndDate')?.value || '';
  const store = document.getElementById('usageListStore')?.value || '';
  const keyword = (document.getElementById('usageListKeyword')?.value || '').toLowerCase();

  let list = reservations.filter(r=>{
    const period = getReservationPeriod(r);

    let hitDate = true;

    if(startDate && endDate){
      hitDate = dateRangesOverlap(
        startDate,
        endDate,
        period.start,
        period.end
      );
    }else if(startDate){
      hitDate = dateRangesOverlap(
        startDate,
        startDate,
        period.start,
        period.end
      );
    }else if(endDate){
      hitDate = dateRangesOverlap(
        endDate,
        endDate,
        period.start,
        period.end
      );
    }

    const hitStore = !store || r.store === store;

    const hay = [
      r.customer,
      r.code,
      r.store,
      r.useDate,
      r.pickupDate,
      r.returnDate,
      r.memo
    ].join(' ').toLowerCase();

    const hitKeyword = !keyword || hay.includes(keyword);

    return hitDate && hitStore && hitKeyword;
  });

  list = list.sort((a,b)=>{
    return String(a.useDate || '').localeCompare(String(b.useDate || ''));
  });

  if(!list.length){
    box.innerHTML = '<div class="empty">該当する予約はありません</div>';
    return;
  }

  box.innerHTML = list.map(r=>{
    const item = items.find(x=>x.code===r.code);
    const itemText = item ? `${item.type}／${item.color}／${item.size}` : '-';
    const period = getReservationPeriod(r);

    return `
      <div class="item">
        <h3>${escapeHtml(r.customer || '-')} 様</h3>
        <div class="meta">
          店舗：${escapeHtml(r.store || '-')}<br>
          使用期間：${escapeHtml(period.start)}〜${escapeHtml(period.end)}<br>
          使用日：${escapeHtml(r.useDate || '-')}<br>
          袴：${escapeHtml(itemText)}<br>
          商品番号：${escapeHtml(r.code || '-')}<br>
          ${r.memo ? 'メモ：'+escapeHtml(r.memo) : ''}
        </div>
      </div>
    `;
  }).join('');
}

function toDateOnly(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}

function addDays(dateStr, days){
  const d = toDateOnly(dateStr);
  if(!d) return '';
  d.setDate(d.getDate() + days);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function dateRangesOverlap(startA, endA, startB, endB){
  const a1 = toDateOnly(startA);
  const a2 = toDateOnly(endA);
  const b1 = toDateOnly(startB);
  const b2 = toDateOnly(endB);
  if(!a1 || !a2 || !b1 || !b2) return false;
  return a1 <= b2 && b1 <= a2;
}

function isItemAvailableForUseDate(item, useDate){
  if(!useDate) return true;

  const targetStart = useDate;
  const targetEnd = addDays(useDate, 3);

  return !reservations.some(r=>{
    if(r.code !== item.code) return false;

    // 予約側は「お渡し日の1日前」から「返却日」までを使用中期間とする
    const baseStart = r.pickupDate || r.useDate;
    const reservedStart = addDays(baseStart, -1);
    const reservedEnd = r.returnDate || addDays(r.useDate, 3);

    return dateRangesOverlap(targetStart, targetEnd, reservedStart, reservedEnd);
  });
}

function setReservationFormFromItem(item, code, useDate){
  if(!item) return;

  const typeSelect = document.getElementById('reserveFilterType');

  // 1. 種類をセット
  if(typeSelect){
    typeSelect.value = item.type || '';
  }

  // 2. 色の選択肢を「種類」に合わせて作り直してから色をセット
  if(colorSelect){
    const colors = [...new Set(
      items
        .filter(x => !item.type || x.type === item.type)
        .map(x => x.color)
        .filter(Boolean)
    )];

    colorSelect.innerHTML = '<option value="">色すべて</option>' +
      colors.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

    colorSelect.value = item.color || '';
  }

  // 3. 袴選択肢を「種類・色」に合わせて作り直してから商品番号をセット
  if(codeSelect){
    const filtered = items.filter(x=>{
      return (!item.type || x.type === item.type)
        && (!item.color || x.color === item.color);
    });

    codeSelect.innerHTML =
      '<option value="">選択してください</option>' +
      filtered.map(x=>{
        const checks = (x.checks||[]).length ? '／' + (x.checks||[]).join('・') : '';
        const label = `${x.type}｜${x.color}｜${x.size}｜${x.code}${checks}`;
        return `<option value="${escapeHtml(x.code)}">${escapeHtml(label)}</option>`;
      }).join('');

    codeSelect.value = code;

    if(codeSelect.value !== code){
      codeSelect.innerHTML += `<option value="${escapeHtml(code)}">${escapeHtml(item.type)}｜${escapeHtml(item.color)}｜${escapeHtml(item.size)}｜${escapeHtml(code)}</option>`;
      codeSelect.value = code;
    }
  }

  // 4. 使用日と返却日をセット
  const useInput = document.getElementById('useDate');
  if(useInput){
    useInput.value = useDate;
    useInput.defaultValue = useDate;
    useInput.setAttribute('value', useDate);
  }

  const returnInput = document.getElementById('returnDate');
  if(returnInput){
    const ret = addDays(useDate, 3);
    returnInput.value = ret;
    returnInput.defaultValue = ret;
    returnInput.setAttribute('value', ret);
  }

  checkConflict();
}

function sortItemsByCode(list){
  return [...list].sort((a,b)=>{
    const ac = String(a.code || '');
    const bc = String(b.code || '');

    const am = ac.match(/-(\d+)$/);
    const bm = bc.match(/-(\d+)$/);

    const an = am ? parseInt(am[1]) : 0;
    const bn = bm ? parseInt(bm[1]) : 0;

    if(ac === bc) return 0;

    // prefix compare first
    const ap = ac.replace(/-(\d+)$/,'');
    const bp = bc.replace(/-(\d+)$/,'');

    if(ap !== bp){
      return ap.localeCompare(bp,'ja');
    }

    return an - bn;
  });
}

function handleUseDateChange(){
  const useDate = document.getElementById('useDate').value;

  if(useDate){
    const d = new Date(useDate);
    d.setDate(d.getDate() + 3);

    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');

    document.getElementById('returnDate').value = `${yyyy}-${mm}-${dd}`;
  }

  checkConflict();
}

function getReservationPeriodFromForm(){
  const useDate = val('useDate');
  const pickupDate = val('pickupDate') || useDate;
  const returnDate = val('returnDate') || addDays(useDate, 3);

  return {
    start: addDays(pickupDate, -1),
    end: returnDate
  };
}

function getReservationPeriod(r){
  const useDate = r.useDate;
  const pickupDate = r.pickupDate || useDate;
  const returnDate = r.returnDate || addDays(useDate, 3);

  return {
    start: addDays(pickupDate, -1),
    end: returnDate
  };
}

function checkConflict(){
  const code = val('reserveCode').trim();
  const useDate = val('useDate');

  if(!code || !useDate){
    document.getElementById('conflictMsg').innerHTML='';
    return false;
  }

  const item = items.find(x=>x.code===code);
  if(!item){
    msg('conflictMsg','この商品番号はまだ袴登録されていません','bad');
    return true;
  }

  const target = getReservationPeriodFromForm();

  const conflict = reservations.find(r=>{
    if(r.id === editingReservationId) return false;
    if(r.code !== code) return false;

    const reserved = getReservationPeriod(r);
    return dateRangesOverlap(target.start, target.end, reserved.start, reserved.end);
  });

  if(conflict){
    const reserved = getReservationPeriod(conflict);
    msg(
      'conflictMsg',
      `重複あり：${escapeHtml(conflict.customer || '-')}様の予約期間 ${reserved.start}〜${reserved.end} と重なっています`,
      'bad'
    );
    return true;
  }

  msg('conflictMsg','重複なし：予約できます','good');
  return false;
}

function saveReservation(){
  const customer = val('customer').trim();
  const code = val('reserveCode').trim();
  const useDate = val('useDate');
  if(!customer || !code || !useDate){msg('conflictMsg','お客様名・使用日・商品番号を入力してください','bad');return}
  if(checkConflict()) return;

  const data = {
    id: editingReservationId || uid(),
    customer,
    code,
    useDate,
    store:val('reserveStore'),
    pickupDate:val('pickupDate'),
    returnDate:val('returnDate'),
    memo:val('reserveMemo')
  };

  const wasEditing = !!editingReservationId;

  if(wasEditing){
    reservations = reservations.map(r => r.id === editingReservationId ? data : r);
  }else{
    reservations.unshift(data);
  }

  persist();
  clearReservation();
  resetReservationEditMode();

  if(wasEditing){
    msg('conflictMsg','予約を修正しました','good');
  }else{
    msg('conflictMsg','予約を保存しました','good');
  }

  renderAvailableStock();
  renderReservations();
  renderItems();
}

function autoRenumberAllItemCodesOnce(){
  const autoKey = 'auto_renumber_type_color_size_v2';

  // H-形式や旧形式が残っている場合のみ再実行
  const needsRenumber = items.some(item=>{
    const code = String(item.code || '');
    return code.startsWith('H-') || !code.match(/.+-.+/);
  });

  if(localStorage.getItem(autoKey) === 'done' && !needsRenumber){
    return;
  }

  const counters = {};
  const codeMap = {};

  items = items.map(item=>{
    const prefix = getCodePrefix(item.type, item.color, item.size);
    counters[prefix] = (counters[prefix] || 0) + 1;

    const newCode = `${prefix}-${String(counters[prefix]).padStart(3,'0')}`;

    if(item.code && item.code !== newCode){
      codeMap[item.code] = newCode;
    }

    return {
      ...item,
      code:newCode
    };
  });

  reservations = reservations.map(r=>{
    if(codeMap[r.code]){
      return {
        ...r,
        code:codeMap[r.code]
      };
    }
    return r;
  });

  persist();
  localStorage.setItem(autoKey, 'done');
}

function normalizeRequestedMujiStock(){
  const targetMap = {
    '無地|紺|S':1,
    '無地|紺|M':4,
    '無地|紺|L':4,
    '無地|紺|LL':3,

    '無地|緑|S':1,
    '無地|緑|M':2,
    '無地|緑|L':5,
    '無地|緑|LL':2,

    '無地|えんじ|S':5,
    '無地|えんじ|M':4,
    '無地|えんじ|L':1,
    '無地|えんじ|LL':1,
    '無地|えんじ|3L':1,

    '無地|紫|SS':1,
    '無地|紫|S':4,
    '無地|紫|M':5,
    '無地|紫|L':4,
    '無地|紫|LL':2,
    '無地|紫|3L':1
  };

  Object.entries(targetMap).forEach(([key, targetCount])=>{
    const [type,color,size] = key.split('|');

    let matched = items
      .filter(x=>x.type===type && x.color===color && x.size===size)
      .sort((a,b)=>String(a.code||'').localeCompare(String(b.code||''),'ja'));

    while(matched.length > targetCount){
      const removeItem = matched.pop();
      const idx = items.findIndex(x=>x.id===removeItem.id);
      if(idx !== -1){
        items.splice(idx,1);
      }
    }

    while(matched.length < targetCount){
      const code = generateCode(type,color,size);

      const item = {
        id: uid(),
        code,
        type,
        color,
        size,
        originalSize:'',
        checks:[],
        memo:'',
        updatedAt:new Date().toISOString()
      };

      items.push(item);
      matched.push(item);
    }
  });

  persist();
}

function cleanupDuplicateMujiStockOnce(){
  const cleanupKey = 'cleanup_duplicate_muji_stock_v1';
  if(localStorage.getItem(cleanupKey) === 'done') return;

  const targets = [
    {type:'無地', color:'紺', counts:{S:1,M:4,L:4,LL:3}},
    {type:'無地', color:'緑', counts:{S:1,M:2,L:5,LL:2}},
    {type:'無地', color:'えんじ', counts:{S:5,M:4,L:1,LL:1,'3L':1}},
    {type:'無地', color:'紫', counts:{SS:1,S:4,M:5,L:4,LL:2,'3L':1}}
  ];

  targets.forEach(t=>{
    Object.entries(t.counts).forEach(([size, keepCount])=>{
      const matched = items
        .filter(x=>x.type===t.type && x.color===t.color && x.size===size)
        .sort((a,b)=>String(a.code||'').localeCompare(String(b.code||''),'ja'));

      if(matched.length > keepCount){
        const removeList = matched.slice(keepCount);
        removeList.forEach(r=>{
          const idx = items.findIndex(x=>x.id===r.id);
          if(idx !== -1){
            items.splice(idx,1);
          }
        });
      }
    });
  });

  persist();
  localStorage.setItem(cleanupKey, 'done');
}

function addRequestedMujiStockOnce(){

    {type:'無地', color:'えんじ', counts:{S:5, M:4, L:1, LL:1, '3L':1}},

    });
  });

  persist();
  localStorage.setItem(seedKey, 'done');
}

let firebaseDb = null;
let firebaseUnsubscribe = null;
let isApplyingFirebaseData = false;

function getFirebaseConfig(){
  const raw = localStorage.getItem('hakama_firebase_config') || '';
  if(!raw) return null;
  try{return JSON.parse(raw);}catch(e){return null;}
}
function getFirebaseStoreId(){
  return localStorage.getItem('hakama_firebase_store_id') || 'legend_hakama';
}
function initFirebaseSettingsUI(){
  const configInput = document.getElementById('firebaseConfigText');
  const storeInput = document.getElementById('firebaseStoreId');
  if(configInput) configInput.value = localStorage.getItem('hakama_firebase_config') || '';
  if(storeInput) storeInput.value = getFirebaseStoreId();
}
function initFirebase(){
  const config = getFirebaseConfig();
  if(!config){ msg('settingMsg','Firebase設定が未入力です。','bad'); return null; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    firebaseDb = firebase.firestore();
    return firebaseDb;
  }catch(err){
    console.error(err);
    msg('settingMsg','Firebase初期化に失敗しました。設定を確認してください。','bad');
    return null;
  }
}
function saveFirebaseSettings(){
  const configText = (document.getElementById('firebaseConfigText')?.value || '').trim();
  const storeId = (document.getElementById('firebaseStoreId')?.value || 'legend_hakama').trim();
  if(!configText){ msg('settingMsg','firebaseConfigを貼り付けてください。','bad'); return; }
  try{ JSON.parse(configText); }catch(e){ msg('settingMsg','firebaseConfigのJSON形式が正しくありません。','bad'); return; }
  localStorage.setItem('hakama_firebase_config', configText);
  localStorage.setItem('hakama_firebase_store_id', storeId || 'legend_hakama');
  if(initFirebase()) msg('settingMsg','Firebase設定を保存しました。','good');
}
function firebaseDocRef(){
  const db = firebaseDb || initFirebase();
  if(!db) return null;
  return db.collection('hakamaStores').doc(getFirebaseStoreId());
}
async function saveToFirebase(){
  const ref = firebaseDocRef();
  if(!ref) return;
  try{
    await ref.set({items, reservations, updatedAt:new Date().toISOString()}, {merge:true});
    msg('settingMsg',`Firebaseへ保存しました。在庫${items.length}件 / 予約${reservations.length}件`,'good');
  }catch(err){
    console.error(err);
    msg('settingMsg','Firebaseへ保存できませんでした。Firestoreルールを確認してください。','bad');
  }
}
async function loadFromFirebase(){
  const ref = firebaseDocRef();
  if(!ref) return;
  if(!confirm('Firebaseの内容で、この端末のデータを上書きしますか？')) return;
  try{
    const snap = await ref.get();
    if(!snap.exists){ msg('settingMsg','Firebase上にデータがありません。先に保存してください。','bad'); return; }
    const data = snap.data() || {};
    isApplyingFirebaseData = true;
    items = data.items || [];
    reservations = data.reservations || [];
    persist();
    renderItems(); renderReservations(); renderAvailableStock(); renderSizeAvailableSearch();
    isApplyingFirebaseData = false;
    msg('settingMsg',`Firebaseから読込しました。在庫${items.length}件 / 予約${reservations.length}件`,'good');
  }catch(err){
    isApplyingFirebaseData = false;
    console.error(err);
    msg('settingMsg','Firebaseから読込できませんでした。','bad');
  }
}
function startFirebaseRealtimeSync(){
  const ref = firebaseDocRef();
  if(!ref) return;
  if(firebaseUnsubscribe) firebaseUnsubscribe();
  firebaseUnsubscribe = ref.onSnapshot(snap=>{
    if(!snap.exists || isApplyingFirebaseData) return;
    const data = snap.data() || {};
    items = data.items || [];
    reservations = data.reservations || [];
    persist();
    renderItems(); renderReservations(); renderAvailableStock(); renderSizeAvailableSearch();
    msg('settingMsg',`リアルタイム同期中：在庫${items.length}件 / 予約${reservations.length}件`,'good');
  }, err=>{
    console.error(err);
    msg('settingMsg','リアルタイム同期に失敗しました。','bad');
  });
  msg('settingMsg','リアルタイム同期を開始しました。','good');
}
